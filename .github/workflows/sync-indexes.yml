name: Sync bizno indexes from public-data-portal-mcp

# 사업자번호 해석기(lib/bizno_resolver.js)가 읽는 색인 2종은 public-data-portal-mcp의 Actions가 갱신한다
# (corp_name_index: 매주 월 03:00 KST, kiscon_bizno_index: 매월 2일 05:00 KST).
# 이 저장소는 같은 파일을 두 번 만들지 않고, 공개 저장소의 원본을 받아 바뀐 경우에만 커밋한다.
# 외부 API 키가 필요 없다(raw.githubusercontent.com 공개 파일).

permissions:
  contents: write

on:
  schedule:
    # 매주 월요일 06:00 KST (= 일요일 21:00 UTC) — 원본 corp_name_index 갱신(03:00 KST) 이후
    - cron: "0 21 * * 0"
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download indexes
        run: |
          set -e
          BASE="https://raw.githubusercontent.com/Sejin-Koo/public-data-portal-mcp/main/data"
          for f in corp_name_index.json.gz kiscon_bizno_index.json.gz; do
            curl -fsSL --retry 3 -o "/tmp/$f" "$BASE/$f"
            # 받은 파일이 정상 gzip인지 확인한 뒤에만 교체한다(잘린 파일로 덮어쓰지 않도록)
            gzip -t "/tmp/$f"
            cp "/tmp/$f" "data/$f"
          done

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data/; then
            echo "변경 없음 — 커밋 생략"
          else
            git add data/corp_name_index.json.gz data/kiscon_bizno_index.json.gz
            git commit -m "chore: 사업자번호 색인 동기화 ($(date -u +%Y-%m-%d))"
            git push
          fi
